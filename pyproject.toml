[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-data-crawler"
version = "0.1.0"
description = "Bilibili 视频信息、评论、字幕、弹幕和搜索采集工具"
requires-python = ">=3.9"
dependencies = [
    "playwright",
    "protobuf>=6.31.1,<7",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools",
]
gui = [
    "PySide6>=6.7",
]

[project.scripts]
bilibili = "main:main"
bilibili-gui = "qt_ui.app:main"

[tool.setuptools]
packages = [
    "qt_ui",
]
py-modules = [
    "bilibili_api",
    "config",
    "crawler_common",
    "crawler_comment",
    "crawler_dm",
    "crawler_hot",
    "crawler_info",
    "crawler_search",
    "crawler_subtitle",
    "crawler_up",
    "dm_pb2",
    "login",
    "main",
    "qt_app",
]
